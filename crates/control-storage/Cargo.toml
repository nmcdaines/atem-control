[package]
name = "control-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
control-core = { path = "../control-core" }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
